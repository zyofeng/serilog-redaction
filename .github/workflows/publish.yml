name: Publish
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Pack
        run: dotnet pack -c Release --no-build -o published
      - name: Push to GitHub registry
        run: dotnet nuget push ./published/*.nupkg -k "${{ secrets.GITHUB_TOKEN }}" -s https://nuget.pkg.github.com/zyofeng/index.json --skip-duplicate
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet registry
        run: dotnet nuget push ./published/*.nupkg -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Nuget packages
          path: published/*
