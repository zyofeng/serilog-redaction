name: Validation
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
          global-json-file: global.json
      - name: Restore packages
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build
